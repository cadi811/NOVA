<style>

body{min-height:100dvh;overflow:hidden}

button{cursor:pointer}
.hidden{display:none!important}
.app{height:100dvh;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;background:var(--bg)}
.topbar{padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #17171c;background:rgba(9,9,11,.96);backdrop-filter:blur(16px);z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brandMark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#000;display:grid;place-items:center;font-weight:900;letter-spacing:-1px}.brandText{min-width:0}.brandText b{display:block;font-size:15px}.brandText span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}

.screen{display:none;animation:fade .15s ease}.screen.active{display:block}@keyframes fade{from{opacity:.65;transform:translateY(3px)}to{opacity:1;transform:none}}
.h1{font-size:29px;font-weight:850;letter-spacing:-.8px;margin:8px 0 4px}.sub{font-size:13px;color:var(--muted);line-height:1.4;margin-bottom:15px}
.card{background:var(--panel);border:1px solid #202028;border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}.cardTitle{font-size:17px;font-weight:760;margin-bottom:4px}.cardSub{font-size:12px;color:var(--muted);line-height:1.45}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}.stat{background:var(--panel);border:1px solid #202028;border-radius:18px;padding:13px 11px;min-height:87px}.stat b{font-size:19px;display:block;margin-top:9px}.stat span{font-size:11px;color:var(--muted)}
.aiBox{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid #282832;border-radius:18px;padding:8px;margin-top:14px}.aiBox input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:14px;min-width:0;padding:7px}.iconBtn,.roundBtn{border:0;background:var(--panel2);color:var(--text);width:38px;height:38px;border-radius:12px;display:grid;place-items:center}.accentBtn{border:0;background:var(--accent);color:var(--accentText);height:46px;border-radius:15px;font-weight:800;padding:0 15px}.ghostBtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);height:42px;border-radius:14px;padding:0 14px;font-weight:650}.dangerBtn{background:transparent;border:1px solid rgba(255,95,104,.45);color:var(--danger)}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:19px 2px 9px}.sectionHead b{font-size:15px}.sectionHead button{border:0;background:transparent;color:var(--accent);font-size:12px}
.appt{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #24242a}.appt:last-child{border-bottom:0}.apptTime{font-size:13px;font-weight:800}.apptMain b{font-size:14px;display:block}.apptMain span{font-size:11px;color:var(--muted);display:block;margin-top:3px}.statusDot{width:9px;height:9px;border-radius:50%;background:var(--info)}.statusDot.done{background:var(--ok)}.statusDot.cancelled{background:var(--danger)}.statusDot.noshow{background:var(--warn)}
.bottomNav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,1180px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(13,13,16,.97);backdrop-filter:blur(20px);border-top:1px solid #24242a;z-index:40}.navBtn{border:0;background:transparent;color:#85858f;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:5px 0}.navBtn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9}.navBtn.active{color:var(--accent)}
.monthHead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:4px 0 10px}.monthHead h2{text-align:center;margin:0;font-size:21px}.calBtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:#fff}
.weekdays,.monthGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekdays{color:#7f7f88;font-size:10px;text-align:center;margin:6px 0}.dayCell{min-height:60px;border:1px solid #24242b;background:var(--panel);border-radius:13px;padding:7px 5px;position:relative;color:#fff;text-align:left}.dayCell.other{opacity:.28}.dayCell.today{border-color:var(--accent)}.dayCell.selected{background:var(--accent);color:#000;border-color:var(--accent)}.dayNum{font-size:12px;font-weight:800}.dayDots{display:flex;gap:3px;flex-wrap:wrap;margin-top:9px}.miniDot{width:6px;height:6px;border-radius:50%;background:var(--info)}.miniDot.done{background:var(--ok)}.miniDot.cancelled{background:var(--danger)}.miniDot.noshow{background:var(--warn)}.dayCount{position:absolute;right:5px;bottom:4px;font-size:9px;color:var(--muted)}.dayCell.selected .dayCount{color:#202024}
.flex{display:flex}.gap8{gap:8px}.grow{flex:1}.rowBetween{display:flex;align-items:center;justify-content:space-between;gap:10px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:2px;scrollbar-width:none}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 11px;border-radius:999px;font-size:11px;white-space:nowrap}.chip.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:800}
.listItem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #25252c}.listItem:last-child{border-bottom:0}.listItem .meta{min-width:0}.listItem b{font-size:14px}.listItem small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.price{font-weight:850;color:var(--accent);white-space:nowrap}
.kasseGrid{display:grid;grid-template-columns:1fr;gap:12px}.serviceBtn{width:100%;text-align:left;border:1px solid #292933;background:var(--panel2);color:#fff;border-radius:15px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.serviceBtn.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.totalBox{display:flex;justify-content:space-between;align-items:end;margin-top:12px}.totalBox b{font-size:28px}.payMethods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.payBtn{height:48px;border:1px solid var(--line);border-radius:15px;background:var(--panel2);color:#fff;font-weight:750}.payBtn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.search{width:100%;height:44px;border-radius:14px;border:1px solid #292933;background:var(--panel);color:#fff;outline:none;padding:0 13px;margin-bottom:10px}.customerAvatar{width:42px;height:42px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:850;color:var(--accent);flex:0 0 42px}.customerRow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #23232a}.customerRow:last-child{border-bottom:0}.customerRow .info{flex:1;min-width:0}.customerRow b{font-size:14px}.customerRow span{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.menuItem{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#fff;padding:14px 0;border-bottom:1px solid #24242b;text-align:left}.menuItem:last-child{border-bottom:0}.menuIcon{width:38px;height:38px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;color:var(--accent)}.menuText{flex:1}.menuText b{display:block;font-size:14px}.menuText span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.chev{color:#73737b}
.formGrid{display:grid;grid-template-columns:1fr;gap:10px}.fieldWrap label{display:block;color:var(--muted);font-size:11px;margin:0 0 6px 2px}.field{width:100%;height:44px;border:1px solid #2a2a32;border-radius:13px;background:var(--panel2);color:#fff;outline:none;padding:0 12px}.field:focus{border-color:var(--accent)}textarea.field{height:84px;padding-top:11px;resize:vertical}.toggle{width:46px;height:27px;border-radius:999px;background:#303039;position:relative;border:0}.toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;background:#fff;border-radius:50%;transition:.18s}.toggle.on{background:var(--accent)}.toggle.on::after{left:22px;background:#000}
.tableWrap{overflow:auto;border:1px solid #24242b;border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:670px}.table th,.table td{text-align:left;padding:10px 11px;border-bottom:1px solid #24242b;font-size:11px}.table th{color:#90909a;font-weight:700;background:#111116;position:sticky;top:0}.table tr:last-child td{border-bottom:0}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0}.modalBack.show{display:flex}.modal{width:min(100%,560px);max-height:88dvh;overflow:auto;background:#15151a;border:1px solid #2a2a31;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.45)}.modalHandle{width:42px;height:4px;border-radius:999px;background:#3b3b42;margin:0 auto 14px}.modal h3{margin:0 0 4px;font-size:20px}.modal p{margin:0 0 14px;color:var(--muted);font-size:12px}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:94px;background:#f3f3f5;color:#111;padding:10px 13px;border-radius:13px;font-size:12px;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1}
.login{position:fixed;inset:0;background:radial-gradient(circle at 60% -10%,rgba(215,255,53,.12),transparent 34%),var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px}.loginBox{width:min(420px,100%)}.loginLogo{width:76px;height:76px;background:var(--accent);color:#000;border-radius:24px;display:grid;place-items:center;font-size:28px;font-weight:950;margin:0 auto 18px}.loginBox h1{text-align:center;margin:0;font-size:31px}.loginBox p{text-align:center;color:var(--muted);font-size:13px;line-height:1.45;margin:8px 0 22px}.demoBtns{display:grid;gap:10px}.demoBtn{height:56px;border-radius:17px;border:1px solid #2a2a32;background:var(--panel);color:#fff;text-align:left;padding:0 15px}.demoBtn b{display:block}.demoBtn span{font-size:11px;color:var(--muted)}.demoBtn.owner{border-color:var(--accent)}
.themePreview{height:120px;border-radius:18px;background:linear-gradient(135deg,var(--panel2),#070709);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.themePreview::before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:var(--accent);filter:blur(60px);opacity:.16;top:-70px;right:-40px}.themePreview .brandMark{width:54px;height:54px;border-radius:18px;font-size:20px;z-index:2}
.colorRow{display:flex;gap:10px;align-items:center}.colorDot{width:32px;height:32px;border-radius:10px;border:2px solid #fff2}.colorInput{width:50px;height:38px;border:0;padding:0;background:transparent}
.chart{height:145px;display:flex;align-items:end;gap:7px;padding:8px 2px 0}.bar{flex:1;background:linear-gradient(180deg,var(--accent),rgba(215,255,53,.28));border-radius:8px 8px 3px 3px;min-width:10px}.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:7px}
.permissionBox{background:var(--panel2);border-radius:14px;padding:11px;margin-top:8px}.permissionRow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #2c2c33}.permissionRow:last-child{border-bottom:0}.permissionRow span{font-size:12px}
@media(min-width:760px){.content{padding-left:24px;padding-right:24px}.kasseGrid{grid-template-columns:1.1fr .9fr}.modalBack{align-items:center;padding:24px}.modal{border-radius:26px}.grid3{grid-template-columns:repeat(3,1fr)}.dayCell{min-height:88px}.formGrid.two{grid-template-columns:1fr 1fr}.bottomNav{max-width:1180px}}
@media(max-width:390px){.grid3{gap:6px}.stat{padding:11px 8px}.stat b{font-size:17px}.dayCell{min-height:55px;padding:6px 4px}.dayNum{font-size:11px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginBox">
    <div class="loginLogo">N</div>
    <h1>NOVA</h1>
    <p>Temporärer Produktname · Demo für Termin-, Kassen- und Betriebsführung.</p>
    <div class="demoBtns">
      <button class="demoBtn owner" onclick="demoLogin('owner')"><b>Als Geschäftsführerin testen</b><span>Vollzugriff auf Kalender, Kasse, Kunden, Team, Statistik und Exporte</span></button>
      <button class="demoBtn" onclick="demoLogin('employee')"><b>Als Mitarbeiterin testen</b><span>Nur eigene zugeteilte Termine</span></button>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand"><div class="brandMark">N</div><div class="brandText"><b id="businessNameTop">NOVA Studio</b><span id="businessTypeTop">Beauty & Services</span></div></div>
    <button id="rolePill" class="rolePill" onclick="openAccountMenu()">Inhaberin</button>
  </header>
  <main id="content" class="content">
    <section id="screen-today" class="screen active"></section>
    <section id="screen-calendar" class="screen"></section>
    <section id="screen-pos" class="screen"></section>
    <section id="screen-customers" class="screen"></section>
    <section id="screen-more" class="screen"></section>
  </main>
  <nav id="bottomNav" class="bottomNav">
    <button class="navBtn active" data-screen="today" onclick="go('today',this)"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg><span>Heute</span></button>
    <button class="navBtn" data-screen="calendar" onclick="go('calendar',this)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>Kalender</span></button>
    <button class="navBtn ownerOnly" data-screen="pos" onclick="go('pos',this)"><svg viewBox="0 0 24 24"><path d="M4 7h16v11H4z"/><path d="M7 4h10v3M8 12h8M8 15h5"/></svg><span>Kasse</span></button>
    <button class="navBtn ownerOnly" data-screen="customers" onclick="go('customers',this)"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 11c2.5.4 4 2.2 4 5"/></svg><span>Kunden</span></button>
    <button class="navBtn ownerOnly" data-screen="more" onclick="go('more',this)"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Mehr</span></button>
  </nav>
</div>

<div id="modalBack" class="modalBack" onclick="if(event.target===this) closeModal()"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast"></div>
<script>
const DEFAULT = {
  role:'owner', selectedEmployeeId:'e1', selectedDate:new Date().toISOString().slice(0,10), calendarMonth:new Date().toISOString().slice(0,7),
  business:{name:'NOVA Studio',type:'Beauty & Services',phone:'+41 79 555 12 34',email:'hallo@nova-demo.ch',address:'Zürich, Schweiz',currency:'CHF',accent:'#d7ff35',dark:true},
  hours:{mon:['09:00','18:00'],tue:['09:00','18:00'],wed:['09:00','18:00'],thu:['09:00','20:00'],fri:['09:00','20:00'],sat:['09:00','17:00'],sun:null},
  holidays:[{id:'h1',from:'2026-10-12',to:'2026-10-18',label:'Betriebsferien'}],
  employees:[
    {id:'e1',name:'Sofia Keller',color:'#76b9ff',active:true,workDays:[1,2,3,4,5],permissions:{ownAppointments:true,editOwn:false,pos:false,customers:false}},
    {id:'e2',name:'Lea Meier',color:'#f2a6ff',active:true,workDays:[2,3,4,5,6],permissions:{ownAppointments:true,editOwn:true,pos:false,customers:false}},
    {id:'e3',name:'Nina Rossi',color:'#ffca62',active:true,workDays:[1,3,5,6],permissions:{ownAppointments:true,editOwn:false,pos:false,customers:false}}
  ],
  services:[
    {id:'s1',cat:'Nägel',name:'Gel Neumodellage',duration:90,price:85,active:true},
    {id:'s2',cat:'Nägel',name:'Auffüllen',duration:75,price:70,active:true},
    {id:'s3',cat:'Haare',name:'Waschen & Schneiden',duration:60,price:65,active:true},
    {id:'s4',cat:'Brows',name:'Augenbrauen Styling',duration:30,price:35,active:true},
    {id:'s5',cat:'Wellness',name:'Relax Massage',duration:60,price:95,active:true}
  ],
  customers:[
    {id:'c1',name:'Sara Müller',phone:'+41 79 111 22 33',email:'sara@example.ch',notes:'Bevorzugt Nachmittag.'},
    {id:'c2',name:'Mia Huber',phone:'+41 78 444 55 66',email:'mia@example.ch',notes:''},
    {id:'c3',name:'Laura Frei',phone:'+41 76 222 33 44',email:'laura@example.ch',notes:'Keine SMS, nur WhatsApp.'},
    {id:'c4',name:'Nora Baumann',phone:'+41 77 555 77 88',email:'nora@example.ch',notes:''}
  ],
  appointments:[
    {id:'a1',date:'2026-09-09',time:'09:00',duration:90,customerId:'c1',serviceId:'s1',employeeId:'e1',status:'done',note:''},
    {id:'a2',date:'2026-09-09',time:'11:00',duration:75,customerId:'c2',serviceId:'s2',employeeId:'e1',status:'open',note:''},
    {id:'a3',date:'2026-09-09',time:'13:30',duration:60,customerId:'c3',serviceId:'s3',employeeId:'e2',status:'open',note:''},
    {id:'a4',date:'2026-09-09',time:'15:00',duration:30,customerId:'c4',serviceId:'s4',employeeId:'e1',status:'open',note:''},
    {id:'a5',date:'2026-09-10',time:'10:00',duration:60,customerId:'c4',serviceId:'s5',employeeId:'e3',status:'open',note:''},
    {id:'a6',date:'2026-09-11',time:'14:00',duration:90,customerId:'c1',serviceId:'s1',employeeId:'e2',status:'cancelled',note:'Kundin abgesagt'},
    {id:'a7',date:'2026-09-12',time:'10:30',duration:75,customerId:'c2',serviceId:'s2',employeeId:'e3',status:'open',note:''}
  ],
  sales:[
    {id:'sale1',date:'2026-09-09',time:'10:28',appointmentId:'a1',customerId:'c1',employeeId:'e1',items:[{serviceId:'s1',qty:1,price:85}],subtotal:85,discount:0,tip:10,total:95,method:'TWINT',status:'paid',reference:'DEMO-TW-1001'}
  ],
  priceHistory:[]
};
let state = loadState();
function loadState(){try{const x=JSON.parse(localStorage.getItem('nova_demo_v3'));return x?mergeDefaults(x):structuredClone(DEFAULT)}catch(e){return structuredClone(DEFAULT)}}
function mergeDefaults(x){return Object.assign(structuredClone(DEFAULT),x)}
function save(){localStorage.setItem('nova_demo_v3',JSON.stringify(state));applyTheme()}
function resetDemo(){localStorage.removeItem('nova_demo_v3');state=structuredClone(DEFAULT);save();renderAll();toast('Demo wurde zurückgesetzt.')}
function byId(arr,id){return arr.find(x=>x.id===id)}
function fmtDate(iso,opt={day:'2-digit',month:'2-digit',year:'numeric'}){return new Intl.DateTimeFormat('de-CH',opt).format(new Date(iso+'T12:00:00'))}
function money(v){return new Intl.NumberFormat('de-CH',{style:'currency',currency:state.business.currency||'CHF'}).format(Number(v||0))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function uid(p){return p+Math.random().toString(36).slice(2,9)}
function currentEmployee(){return byId(state.employees,state.selectedEmployeeId)||state.employees[0]}
function visibleAppointments(){return state.role==='employee'?state.appointments.filter(a=>a.employeeId===currentEmployee().id):state.appointments}
function service(a){return byId(state.services,a.serviceId)||{name:'Leistung',price:0,duration:a.duration||0}}
function customer(a){return byId(state.customers,a.customerId)||{name:'Ohne Namen'} }
function employee(a){return byId(state.employees,a.employeeId)||{name:'Nicht zugeteilt'} }
function statusLabel(s){return {open:'Offen',done:'Erledigt',cancelled:'Abgesagt',noshow:'Nicht erschienen'}[s]||s}
function statusClass(s){return s==='done'?'done':s==='cancelled'?'cancelled':s==='noshow'?'noshow':''}
function applyTheme(){document.documentElement.style.setProperty('--accent',state.business.accent||'#d7ff35');document.querySelector('meta[name="theme-color"]').setAttribute('content','#09090b')}
function demoLogin(role){state.role=role; if(role==='employee') state.selectedEmployeeId='e1'; save();document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderAll();go('today')}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function go(name,btn){if(state.role==='employee'&&!['today','calendar'].includes(name))name='today';document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('screen-'+name).classList.add('active');document.querySelectorAll('.navBtn').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));document.getElementById('content').scrollTop=0; if(name==='today')renderToday(); if(name==='calendar')renderCalendar();if(name==='pos')renderPOS();if(name==='customers')renderCustomers();if(name==='more')renderMore()}
function renderAll(){applyTheme();document.getElementById('businessNameTop').textContent=state.business.name;document.getElementById('businessTypeTop').textContent=state.business.type;document.getElementById('rolePill').textContent=state.role==='owner'?'Inhaberin':'Mitarbeiterin · '+currentEmployee().name;document.querySelectorAll('.ownerOnly').forEach(x=>x.classList.toggle('hidden',state.role!=='owner'));renderToday();renderCalendar();renderPOS();renderCustomers();renderMore()}
function todayISO(){return '2026-09-09'} // fixed demo day for consistent test data
function todaysAppts(){return visibleAppointments().filter(a=>a.date===todayISO()).sort((a,b)=>a.time.localeCompare(b.time))}
function salesToday(){return state.sales.filter(s=>s.date===todayISO()&&s.status==='paid')}
function revenueToday(){return salesToday().reduce((n,s)=>n+s.total,0)}
function freeTimeToday(){const aps=todaysAppts().filter(a=>!['cancelled','noshow'].includes(a.status));const total=aps.reduce((n,a)=>n+(a.duration||service(a).duration||0),0);const weekday=new Date(todayISO()+'T12:00:00').getDay();const keys=['sun','mon','tue','wed','thu','fri','sat'];const h=state.hours[keys[weekday]];if(!h)return 0;const mins=t=>{const [hh,mm]=t.split(':').map(Number);return hh*60+mm};const open=mins(h[1])-mins(h[0]);return Math.max(0,(open-total)/60)}
function renderToday(){const aps=todaysAppts();const user=state.role==='owner'?'Guten Morgen':'Hallo '+currentEmployee().name.split(' ')[0];document.getElementById('screen-today').innerHTML=`
  <div class="h1">${user}</div><div class="sub">${fmtDate(todayISO(),{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div>
  ${state.role==='owner'?`<div class="aiBox"><input id="aiInput" placeholder="Was möchtest du heute tun?" onkeydown="if(event.key==='Enter')runAssistant()"><button class="iconBtn" onclick="voiceDemo()">🎙</button><button class="iconBtn" style="background:var(--accent);color:#000" onclick="runAssistant()">➜</button></div>`:''}
  <div class="grid3"><div class="stat"><span>Termine heute</span><b>${aps.length}</b></div><div class="stat"><span>${state.role==='owner'?'Umsatz heute':'Eigene Termine'}</span><b>${state.role==='owner'?money(revenueToday()):aps.filter(a=>a.status==='open').length}</b></div><div class="stat" onclick="go('calendar')"><span>Freie Zeit</span><b>${freeTimeToday().toFixed(1).replace('.',',')} h</b></div></div>
  <div class="sectionHead"><b>Nächste Termine</b><button onclick="go('calendar')">Kalender öffnen</button></div>
  <div class="card">${aps.length?aps.map(apptHTML).join(''):'<div class="cardSub">Heute sind keine Termine eingetragen.</div>'}</div>
  ${state.role==='owner'?`<div class="sectionHead"><b>Schnellzugriff</b></div><div class="chips"><button class="chip" onclick="openAppointmentModal('${todayISO()}')">+ Termin</button><button class="chip" onclick="go('pos')">Kassieren</button><button class="chip" onclick="openSubpage('exports')">Export</button><button class="chip" onclick="openSubpage('hours')">Öffnungszeiten</button></div>`:''}`}
function apptHTML(a){return `<div class="appt" onclick="openAppointmentDetail('${a.id}')"><div class="apptTime">${esc(a.time)}</div><div class="apptMain"><b>${esc(customer(a).name)}</b><span>${esc(service(a).name)} · ${esc(employee(a).name)}</span></div><div class="statusDot ${statusClass(a.status)}" title="${statusLabel(a.status)}"></div></div>`}
function renderCalendar(){const ym=state.calendarMonth;const [y,m]=ym.split('-').map(Number);const first=new Date(y,m-1,1);const last=new Date(y,m,0);const start=(first.getDay()+6)%7;let cells='';for(let i=0;i<42;i++){const d=new Date(y,m-1,1-start+i);const iso=d.toISOString().slice(0,10);const other=d.getMonth()!==m-1;const aps=visibleAppointments().filter(a=>a.date===iso);const selected=iso===state.selectedDate;const today=iso===todayISO();cells+=`<button class="dayCell ${other?'other':''} ${selected?'selected':''} ${today?'today':''}" onclick="selectDay('${iso}')"><span class="dayNum">${d.getDate()}</span><div class="dayDots">${aps.slice(0,5).map(a=>`<i class="miniDot ${statusClass(a.status)}"></i>`).join('')}</div>${aps.length?`<span class="dayCount">${aps.length}</span>`:''}</button>`}
const selectedAps=visibleAppointments().filter(a=>a.date===state.selectedDate).sort((a,b)=>a.time.localeCompare(b.time));document.getElementById('screen-calendar').innerHTML=`<div class="h1">Kalender</div><div class="sub">Monatsübersicht · Öffnungszeiten, Ferien und Mitarbeiter werden automatisch berücksichtigt.</div>
<div class="monthHead"><button class="calBtn" onclick="changeMonth(-1)">‹</button><h2>${new Intl.DateTimeFormat('de-CH',{month:'long',year:'numeric'}).format(first)}</h2><button class="calBtn" onclick="changeMonth(1)">›</button></div>
${state.role==='owner'?`<div class="chips" style="margin-bottom:10px"><button class="chip active">Alle</button>${state.employees.filter(e=>e.active).map(e=>`<button class="chip" onclick="filterEmployeeCalendar('${e.id}')">${esc(e.name.split(' ')[0])}</button>`).join('')}</div>`:''}
<div class="weekdays"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div><div class="monthGrid">${cells}</div>
<div class="sectionHead"><b>${fmtDate(state.selectedDate,{weekday:'long',day:'2-digit',month:'long'})}</b>${state.role==='owner'?`<button onclick="openAppointmentModal('${state.selectedDate}')">+ Termin</button>`:''}</div><div class="card">${selectedAps.length?selectedAps.map(apptHTML).join(''):'<div class="cardSub">Keine Termine an diesem Tag.</div>'}</div>`}
function selectDay(iso){state.selectedDate=iso;state.calendarMonth=iso.slice(0,7);save();renderCalendar()}
function changeMonth(delta){let [y,m]=state.calendarMonth.split('-').map(Number);m+=delta;if(m<1){m=12;y--}if(m>12){m=1;y++}state.calendarMonth=`${y}-${String(m).padStart(2,'0')}`;state.selectedDate=`${y}-${String(m).padStart(2,'0')}-01`;save();renderCalendar()}
function filterEmployeeCalendar(id){toast('Mitarbeiterfilter ist in dieser Demo über Terminzuweisung sichtbar. Vollfilter folgt mit Backend.')}
function renderPOS(){const unpaid=state.appointments.filter(a=>a.date===todayISO()&&a.status==='open');document.getElementById('screen-pos').innerHTML=`<div class="h1">Kasse</div><div class="sub">Termin kassieren oder freien Verkauf starten. Zahlung markiert den Termin automatisch als erledigt.</div><div class="kasseGrid"><div><div class="card"><div class="cardTitle">Offene Termine</div>${unpaid.length?unpaid.map(a=>`<button class="serviceBtn" style="margin-top:8px" onclick="startCheckoutFromAppointment('${a.id}')"><span><b>${esc(a.time)} · ${esc(customer(a).name)}</b><small>${esc(service(a).name)} · ${esc(employee(a).name)}</small></span><strong>${money(service(a).price)}</strong></button>`).join(''):'<div class="cardSub" style="margin-top:8px">Keine offenen Termine.</div>'}</div><div class="card"><div class="cardTitle">Freier Verkauf</div><div class="cardSub">Dienstleistungen auswählen.</div>${state.services.filter(s=>s.active).map(s=>`<button class="serviceBtn" style="margin-top:8px" onclick="addToCart('${s.id}')"><span><b>${esc(s.name)}</b><small>${s.duration} Min · ${esc(s.cat)}</small></span><strong>${money(s.price)}</strong></button>`).join('')}</div></div><div id="cartPanel">${cartHTML()}</div></div>`}
let cart=[];let checkoutAppointmentId=null;let payMethod='TWINT';
function addToCart(id){const s=byId(state.services,id);cart.push({serviceId:id,qty:1,price:s.price});checkoutAppointmentId=null;renderPOS()}
function startCheckoutFromAppointment(id){const a=byId(state.appointments,id);const s=service(a);cart=[{serviceId:s.id,qty:1,price:s.price}];checkoutAppointmentId=id;renderPOS();document.getElementById('cartPanel')?.scrollIntoView({behavior:'smooth'})}
function cartHTML(){const sub=cart.reduce((n,i)=>n+i.price*i.qty,0);return `<div class="card"><div class="cardTitle">Aktueller Verkauf</div>${cart.length?cart.map(i=>{const s=byId(state.services,i.serviceId);return `<div class="listItem"><div class="meta"><b>${esc(s.name)}</b><small>${s.duration} Min</small></div><span class="price">${money(i.price)}</span></div>`}).join(''):'<div class="cardSub" style="margin-top:8px">Noch keine Leistung gewählt.</div>'}<div class="totalBox"><span>Gesamt</span><b>${money(sub)}</b></div><div class="payMethods"><button class="payBtn ${payMethod==='TWINT'?'active':''}" onclick="setPay('TWINT')">TWINT</button><button class="payBtn ${payMethod==='Karte'?'active':''}" onclick="setPay('Karte')">Karte</button><button class="payBtn ${payMethod==='Bar'?'active':''}" onclick="setPay('Bar')">Bar</button></div><button class="accentBtn" style="width:100%;margin-top:10px" ${cart.length?'':'disabled'} onclick="completePayment()">${payMethod==='Bar'?'Barzahlung verbuchen':'Zahlung starten'}</button></div>`}
function setPay(m){payMethod=m;renderPOS()}
function completePayment(){if(!cart.length)return;const total=cart.reduce((n,i)=>n+i.price*i.qty,0);const ap=checkoutAppointmentId?byId(state.appointments,checkoutAppointmentId):null;const sale={id:uid('sale'),date:todayISO(),time:new Date().toTimeString().slice(0,5),appointmentId:checkoutAppointmentId||null,customerId:ap?.customerId||null,employeeId:ap?.employeeId||state.selectedEmployeeId,items:structuredClone(cart),subtotal:total,discount:0,tip:0,total,method:payMethod,status:'paid',reference:'DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase()};state.sales.push(sale);if(ap)ap.status='done';cart=[];checkoutAppointmentId=null;save();renderAll();toast('Zahlung verbucht. Termin ist jetzt erledigt.')}
function renderCustomers(){document.getElementById('screen-customers').innerHTML=`<div class="h1">Kunden</div><div class="sub">Kontakt, Besuchshistorie, Notizen und Umsatz – ohne medizinische Daten.</div><input id="customerSearch" class="search" placeholder="Kunden suchen" oninput="filterCustomers()"><div id="customerList" class="card">${customersHTML(state.customers)}</div><button class="accentBtn" style="width:100%;margin-top:12px" onclick="openCustomerModal()">+ Kunde</button>`}
function customersHTML(list){return list.map(c=>{const aps=state.appointments.filter(a=>a.customerId===c.id);const spend=state.sales.filter(s=>s.customerId===c.id&&s.status==='paid').reduce((n,s)=>n+s.total,0);return `<div class="customerRow" onclick="openCustomerDetail('${c.id}')"><div class="customerAvatar">${esc(c.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div class="info"><b>${esc(c.name)}</b><span>${aps.length} Termine · ${money(spend)} Umsatz</span></div><span class="chev">›</span></div>`}).join('')}
function filterCustomers(){const q=document.getElementById('customerSearch').value.toLowerCase();document.getElementById('customerList').innerHTML=customersHTML(state.customers.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(q)))}
function renderMore(){document.getElementById('screen-more').innerHTML=`<div class="h1">Mehr</div><div class="sub">Alles, was man nicht jeden Tag braucht.</div><div class="card">${menu('services','✦','Dienstleistungen & Preise','Leistungen, Dauer, Kategorien und Preisverlauf')}${menu('team','👥','Team','Mitarbeiter, Arbeitszeiten und Rechte')}${menu('stats','▥','Statistik & Auswertungen','Umsatz, Auslastung, Zahlungsarten und Leistungen')}${menu('branding','◐','Branding & Design','Logo, Farben, Erscheinungsbild und Icons')}${menu('hours','◷','Öffnungszeiten & Ferien','Regelzeiten, Sondertage und Betriebsferien')}${menu('exports','⇩','Exporte','Excel, CSV und PDF für Buchhaltung/Treuhand')}${menu('settings','⚙','Einstellungen','Geschäftsdaten, Sicherheit und App')}${menu('help','?','Hilfe & Support','Supportzugriff nur mit Freigabe')}${menu('legal','§','Rechtliches & Datenschutz','DSG/GDPR, Datenzugriff und Aufbewahrung')}<button class="menuItem" onclick="logout()"><span class="menuIcon">↪</span><span class="menuText"><b>Abmelden</b><span>Demo verlassen</span></span><span class="chev">›</span></button></div>`}
function menu(id,icon,title,sub){return `<button class="menuItem" onclick="openSubpage('${id}')"><span class="menuIcon">${icon}</span><span class="menuText"><b>${title}</b><span>${sub}</span></span><span class="chev">›</span></button>`}
function modal(html){document.getElementById('modal').innerHTML='<div class="modalHandle"></div>'+html;document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove('show'),2200)}
function openAppointmentDetail(id){const a=byId(state.appointments,id);const canEdit=state.role==='owner'||currentEmployee().permissions.editOwn;modal(`<h3>${esc(customer(a).name)}</h3><p>${fmtDate(a.date,{weekday:'long',day:'2-digit',month:'long'})} · ${esc(a.time)}</p><div class="card"><div class="listItem"><div class="meta"><b>Leistung</b><small>${esc(service(a).name)}</small></div><span class="price">${money(service(a).price)}</span></div><div class="listItem"><div class="meta"><b>Mitarbeiter</b><small>${esc(employee(a).name)}</small></div></div><div class="listItem"><div class="meta"><b>Status</b><small>${statusLabel(a.status)}</small></div></div>${a.note?`<div class="listItem"><div class="meta"><b>Notiz</b><small>${esc(a.note)}</small></div></div>`:''}</div>${state.role==='owner'?`<div class="modalActions"><button class="ghostBtn" onclick="setAppointmentStatus('${id}','cancelled')">Absagen</button><button class="accentBtn" onclick="startCheckoutModal('${id}')">Kassieren</button></div><div class="modalActions"><button class="ghostBtn" onclick="setAppointmentStatus('${id}','noshow')">Nicht erschienen</button><button class="ghostBtn" onclick="setAppointmentStatus('${id}','done')">Erledigt</button></div>`:canEdit?`<div class="modalActions"><button class="ghostBtn" onclick="setAppointmentStatus('${id}','cancelled')">Absagen</button><button class="ghostBtn" onclick="closeModal()">Schliessen</button></div>`:`<button class="ghostBtn" style="width:100%;margin-top:12px" onclick="closeModal()">Schliessen</button>`}`)}
function setAppointmentStatus(id,s){byId(state.appointments,id).status=s;save();closeModal();renderAll();toast('Status: '+statusLabel(s))}
function startCheckoutModal(id){closeModal();go('pos');startCheckoutFromAppointment(id)}
function openAppointmentModal(date){modal(`<h3>Neuer Termin</h3><p>${fmtDate(date,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</p><div class="formGrid"><div class="fieldWrap"><label>Kunde</label><select id="naCustomer" class="field">${state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="fieldWrap"><label>Leistung</label><select id="naService" class="field">${state.services.filter(s=>s.active).map(s=>`<option value="${s.id}">${esc(s.name)} · ${money(s.price)}</option>`).join('')}</select></div><div class="fieldWrap"><label>Mitarbeiter</label><select id="naEmployee" class="field">${state.employees.filter(e=>e.active).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="fieldWrap"><label>Uhrzeit</label><input id="naTime" class="field" type="time" value="10:00"></div></div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Abbrechen</button><button class="accentBtn" onclick="createAppointment('${date}')">Speichern</button></div>`)}
function createAppointment(date){const s=byId(state.services,document.getElementById('naService').value);state.appointments.push({id:uid('a'),date,time:document.getElementById('naTime').value,duration:s.duration,customerId:document.getElementById('naCustomer').value,serviceId:s.id,employeeId:document.getElementById('naEmployee').value,status:'open',note:''});save();closeModal();renderAll();toast('Termin erstellt und Mitarbeiter zugeteilt.')}
function openCustomerModal(){modal(`<h3>Neuer Kunde</h3><p>Nur notwendige Kontaktdaten.</p><div class="formGrid"><div class="fieldWrap"><label>Name</label><input id="ncName" class="field" placeholder="Vorname Nachname"></div><div class="fieldWrap"><label>Telefon</label><input id="ncPhone" class="field" placeholder="+41 ..."></div><div class="fieldWrap"><label>E-Mail</label><input id="ncEmail" class="field" type="email" placeholder="name@example.ch"></div></div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Abbrechen</button><button class="accentBtn" onclick="createCustomer()">Speichern</button></div>`)}
function createCustomer(){const n=document.getElementById('ncName').value.trim();if(!n)return toast('Bitte Name eingeben.');state.customers.push({id:uid('c'),name:n,phone:document.getElementById('ncPhone').value,email:document.getElementById('ncEmail').value,notes:''});save();closeModal();renderCustomers();toast('Kunde gespeichert.')}
function openCustomerDetail(id){const c=byId(state.customers,id);const aps=state.appointments.filter(a=>a.customerId===id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));const spend=state.sales.filter(s=>s.customerId===id&&s.status==='paid').reduce((n,s)=>n+s.total,0);modal(`<h3>${esc(c.name)}</h3><p>${esc(c.phone)} · ${esc(c.email)}</p><div class="grid3"><div class="stat"><span>Besuche</span><b>${aps.filter(a=>a.status==='done').length}</b></div><div class="stat"><span>Umsatz</span><b>${money(spend)}</b></div><div class="stat"><span>No-Shows</span><b>${aps.filter(a=>a.status==='noshow').length}</b></div></div><div class="card"><div class="cardTitle">Notiz</div><div class="cardSub">${esc(c.notes||'Keine Notiz')}</div></div><div class="sectionHead"><b>Historie</b></div><div class="card">${aps.length?aps.map(apptHTML).join(''):'<div class="cardSub">Noch keine Termine.</div>'}</div><button class="ghostBtn" style="width:100%;margin-top:12px" onclick="closeModal()">Schliessen</button>`)}
function openAccountMenu(){modal(`<h3>Account</h3><p>${state.role==='owner'?'Geschäftsführung':'Mitarbeiterzugang'}</p>${state.role==='employee'?`<div class="fieldWrap"><label>Mitarbeiterin wechseln (Demo)</label><select class="field" onchange="state.selectedEmployeeId=this.value;save();closeModal();renderAll()">${state.employees.map(e=>`<option value="${e.id}" ${e.id===state.selectedEmployeeId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>`:''}<button class="ghostBtn" style="width:100%;margin-top:12px" onclick="logout()">Abmelden</button>`)}
function openSubpage(id){const pages={services:servicesPage,team:teamPage,stats:statsPage,branding:brandingPage,hours:hoursPage,exports:exportsPage,settings:settingsPage,help:helpPage,legal:legalPage};modal(pages[id]())}
function servicesPage(){return `<h3>Dienstleistungen & Preise</h3><p>Preisänderungen gelten ab dem gewählten Zeitpunkt; bestehende historische Verkäufe bleiben unverändert.</p><div class="card">${state.services.map(s=>`<div class="listItem"><div class="meta"><b>${esc(s.name)}</b><small>${esc(s.cat)} · ${s.duration} Min · ${s.active?'Aktiv':'Inaktiv'}</small></div><button class="ghostBtn" style="height:36px" onclick="editService('${s.id}')">${money(s.price)}</button></div>`).join('')}</div><button class="accentBtn" style="width:100%;margin-top:12px" onclick="addService()">+ Leistung</button>`}
function editService(id){const s=byId(state.services,id);modal(`<h3>${esc(s.name)}</h3><p>Preis, Dauer und Status ändern.</p><div class="formGrid"><div class="fieldWrap"><label>Name</label><input id="esName" class="field" value="${esc(s.name)}"></div><div class="fieldWrap"><label>Preis CHF</label><input id="esPrice" class="field" type="number" step="0.05" value="${s.price}"></div><div class="fieldWrap"><label>Dauer Minuten</label><input id="esDur" class="field" type="number" value="${s.duration}"></div></div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Abbrechen</button><button class="accentBtn" onclick="saveServiceEdit('${id}')">Speichern</button></div>`)}
function saveServiceEdit(id){const s=byId(state.services,id);const old=s.price;const np=Number(document.getElementById('esPrice').value);s.name=document.getElementById('esName').value;s.duration=Number(document.getElementById('esDur').value);s.price=np;if(old!==np)state.priceHistory.push({id:uid('ph'),serviceId:id,oldPrice:old,newPrice:np,validFrom:new Date().toISOString(),changedBy:'owner'});save();closeModal();openSubpage('services');toast('Leistung aktualisiert.')}
function addService(){modal(`<h3>Neue Leistung</h3><p>Einfach und ohne unnötige Pflichtfelder.</p><div class="formGrid"><div class="fieldWrap"><label>Name</label><input id="asName" class="field"></div><div class="fieldWrap"><label>Kategorie</label><input id="asCat" class="field" value="Allgemein"></div><div class="fieldWrap"><label>Dauer Minuten</label><input id="asDur" class="field" type="number" value="60"></div><div class="fieldWrap"><label>Preis CHF</label><input id="asPrice" class="field" type="number" value="0"></div></div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Abbrechen</button><button class="accentBtn" onclick="saveNewService()">Hinzufügen</button></div>`)}
function saveNewService(){state.services.push({id:uid('s'),cat:document.getElementById('asCat').value,name:document.getElementById('asName').value||'Neue Leistung',duration:Number(document.getElementById('asDur').value),price:Number(document.getElementById('asPrice').value),active:true});save();closeModal();openSubpage('services')}
function teamPage(){return `<h3>Team</h3><p>Keine Lohnabrechnung. Team dient nur Terminplanung, Arbeitszeiten, Leistungen und Zugriffsrechten.</p><div class="card">${state.employees.map(e=>`<div class="customerRow" onclick="editEmployee('${e.id}')"><div class="customerAvatar" style="color:${e.color}">${esc(e.name.split(' ').map(x=>x[0]).join(''))}</div><div class="info"><b>${esc(e.name)}</b><span>${e.active?'Aktiv':'Inaktiv'} · ${e.workDays.length} Arbeitstage/Woche</span></div><span class="chev">›</span></div>`).join('')}</div><button class="accentBtn" style="width:100%;margin-top:12px" onclick="addEmployee()">+ Mitarbeiter</button>`}
function editEmployee(id){const e=byId(state.employees,id);modal(`<h3>${esc(e.name)}</h3><p>Rechte der Mitarbeiter-App.</p><div class="permissionBox"><div class="permissionRow"><span>Eigene Termine sehen</span><button class="toggle ${e.permissions.ownAppointments?'on':''}" onclick="togglePerm('${id}','ownAppointments',this)"></button></div><div class="permissionRow"><span>Eigene Termine bearbeiten</span><button class="toggle ${e.permissions.editOwn?'on':''}" onclick="togglePerm('${id}','editOwn',this)"></button></div><div class="permissionRow"><span>Kasse verwenden</span><button class="toggle ${e.permissions.pos?'on':''}" onclick="togglePerm('${id}','pos',this)"></button></div><div class="permissionRow"><span>Kundenbereich sehen</span><button class="toggle ${e.permissions.customers?'on':''}" onclick="togglePerm('${id}','customers',this)"></button></div></div><button class="ghostBtn" style="width:100%;margin-top:12px" onclick="closeModal()">Schliessen</button>`)}
function togglePerm(id,k,btn){const e=byId(state.employees,id);e.permissions[k]=!e.permissions[k];btn.classList.toggle('on',e.permissions[k]);save()}
function addEmployee(){modal(`<h3>Mitarbeiter einladen</h3><p>In der finalen Version erhält die Person einen sicheren Einladungslink oder QR-Code.</p><div class="fieldWrap"><label>Name</label><input id="aeName" class="field" placeholder="Vorname Nachname"></div><div class="fieldWrap" style="margin-top:10px"><label>E-Mail</label><input class="field" placeholder="mitarbeiter@example.ch"></div><button class="accentBtn" style="width:100%;margin-top:12px" onclick="saveEmployee()">Demo-Mitarbeiter anlegen</button>`)}
function saveEmployee(){const n=document.getElementById('aeName').value||'Neue Mitarbeiterin';state.employees.push({id:uid('e'),name:n,color:'#76b9ff',active:true,workDays:[1,2,3,4,5],permissions:{ownAppointments:true,editOwn:false,pos:false,customers:false}});save();closeModal();openSubpage('team')}
function statsPage(){const months=[4100,5200,4800,6100,6900,7800,8200];const max=Math.max(...months);const sales=state.sales.filter(s=>s.status==='paid');const byMethod={};sales.forEach(s=>byMethod[s.method]=(byMethod[s.method]||0)+s.total);return `<h3>Statistik & Auswertungen</h3><p>Einfache Kennzahlen statt überladener Buchhaltungssoftware.</p><div class="grid3"><div class="stat"><span>Umsatz Demo</span><b>${money(sales.reduce((n,s)=>n+s.total,0))}</b></div><div class="stat"><span>Termine</span><b>${state.appointments.length}</b></div><div class="stat"><span>Ø Bon</span><b>${money(sales.length?sales.reduce((n,s)=>n+s.total,0)/sales.length:0)}</b></div></div><div class="card"><div class="cardTitle">Umsatztrend</div><div class="chart">${months.map(v=>`<div class="bar" style="height:${Math.max(18,v/max*100)}%"></div>`).join('')}</div><div class="legend"><span>Mär</span><span>Apr</span><span>Mai</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span></div></div><div class="card"><div class="cardTitle">Zahlungsarten</div>${Object.entries(byMethod).map(([k,v])=>`<div class="listItem"><div class="meta"><b>${esc(k)}</b></div><span class="price">${money(v)}</span></div>`).join('')||'<div class="cardSub">Noch keine Verkäufe.</div>'}</div>`}
function brandingPage(){return `<h3>Branding & Design</h3><p>Logo hochladen. App gestaltet sich selbst. Alle Designoptionen inklusive.</p><div class="themePreview"><div class="brandMark">N</div></div><div class="card" style="margin-top:12px"><div class="listItem"><div class="meta"><b>Akzentfarbe</b><small>Buttons, Icons, Markierungen</small></div><div class="colorRow"><input class="colorInput" type="color" value="${state.business.accent}" oninput="changeAccent(this.value)"></div></div><div class="listItem"><div class="meta"><b>Logo</b><small>PNG/JPG/SVG – Demo zeigt Vorschau lokal</small></div><button class="ghostBtn" style="height:36px" onclick="toast('Logo-Upload wird im nächsten Backend-Schritt dauerhaft gespeichert.')">Hochladen</button></div><div class="listItem"><div class="meta"><b>Icon-Stil</b><small>Minimal · Elegant · Soft · Modern · Outline · Filled · Neon</small></div></div></div>`}
function changeAccent(v){state.business.accent=v;save();renderAll();openSubpage('branding')}
function hoursPage(){const labels={mon:'Montag',tue:'Dienstag',wed:'Mittwoch',thu:'Donnerstag',fri:'Freitag',sat:'Samstag',sun:'Sonntag'};return `<h3>Öffnungszeiten & Ferien</h3><p>Der Kalender nutzt diese Daten, um freie Zeiten und mögliche Termine zu berechnen.</p><div class="card">${Object.entries(labels).map(([k,l])=>{const h=state.hours[k];return `<div class="listItem"><div class="meta"><b>${l}</b><small>${h?h[0]+' – '+h[1]:'Geschlossen'}</small></div><button class="ghostBtn" style="height:34px" onclick="editHours('${k}','${l}')">Ändern</button></div>`}).join('')}</div><div class="card"><div class="cardTitle">Ferien / Sondertage</div>${state.holidays.map(h=>`<div class="listItem"><div class="meta"><b>${esc(h.label)}</b><small>${fmtDate(h.from)} – ${fmtDate(h.to)}</small></div></div>`).join('')}<button class="ghostBtn" style="width:100%;margin-top:10px" onclick="addHoliday()">+ Ferien eintragen</button></div>`}
function editHours(k,l){const h=state.hours[k]||['09:00','17:00'];modal(`<h3>${l}</h3><p>Öffnungszeit einstellen oder Tag schliessen.</p><div class="formGrid two"><div class="fieldWrap"><label>Von</label><input id="hFrom" class="field" type="time" value="${h[0]}"></div><div class="fieldWrap"><label>Bis</label><input id="hTo" class="field" type="time" value="${h[1]}"></div></div><div class="modalActions"><button class="ghostBtn dangerBtn" onclick="setClosed('${k}')">Geschlossen</button><button class="accentBtn" onclick="saveHours('${k}')">Speichern</button></div>`)}
function saveHours(k){state.hours[k]=[document.getElementById('hFrom').value,document.getElementById('hTo').value];save();closeModal();openSubpage('hours')}
function setClosed(k){state.hours[k]=null;save();closeModal();openSubpage('hours')}
function addHoliday(){modal(`<h3>Ferien eintragen</h3><p>Termine können in diesem Zeitraum blockiert werden.</p><div class="formGrid"><div class="fieldWrap"><label>Bezeichnung</label><input id="holLabel" class="field" value="Ferien"></div><div class="fieldWrap"><label>Von</label><input id="holFrom" class="field" type="date"></div><div class="fieldWrap"><label>Bis</label><input id="holTo" class="field" type="date"></div></div><button class="accentBtn" style="width:100%;margin-top:12px" onclick="saveHoliday()">Speichern</button>`)}
function saveHoliday(){const f=document.getElementById('holFrom').value,t=document.getElementById('holTo').value;if(!f||!t)return toast('Von/Bis wählen.');state.holidays.push({id:uid('h'),from:f,to:t,label:document.getElementById('holLabel').value||'Ferien'});save();closeModal();openSubpage('hours')}
function exportsPage(){return `<h3>Exporte</h3><p>Für Buchhaltung, Treuhänder oder eigene Ablage. Keine eigene Lohn- oder Finanzbuchhaltung.</p><div class="card"><div class="listItem"><div class="meta"><b>Excel-kompatibel (.xls)</b><small>Alle Buchungen mit Datum, Leistung, Betrag, Zahlungsart und Referenz</small></div><button class="ghostBtn" style="height:36px" onclick="exportExcel()">Export</button></div><div class="listItem"><div class="meta"><b>CSV</b><small>Universell für Buchhaltungsimporte</small></div><button class="ghostBtn" style="height:36px" onclick="exportCSV()">Export</button></div><div class="listItem"><div class="meta"><b>PDF Monatsbericht</b><small>Druckfreundliche Zusammenfassung</small></div><button class="ghostBtn" style="height:36px" onclick="exportPDF()">Öffnen</button></div></div><div class="card"><div class="cardTitle">Buchungen</div><div class="tableWrap"><table class="table"><thead><tr><th>Datum</th><th>Zeit</th><th>Kunde</th><th>Mitarbeiter</th><th>Zahlungsart</th><th>Total</th><th>Status</th></tr></thead><tbody>${state.sales.map(s=>`<tr><td>${s.date}</td><td>${s.time}</td><td>${esc(byId(state.customers,s.customerId)?.name||'')}</td><td>${esc(byId(state.employees,s.employeeId)?.name||'')}</td><td>${esc(s.method)}</td><td>${money(s.total)}</td><td>${esc(s.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function saleRows(){return state.sales.map(s=>({Datum:s.date,Uhrzeit:s.time,Kunde:byId(state.customers,s.customerId)?.name||'',Mitarbeiter:byId(state.employees,s.employeeId)?.name||'',Zahlungsart:s.method,Netto:s.subtotal,Trinkgeld:s.tip||0,Rabatt:s.discount||0,Total:s.total,Status:s.status,Referenz:s.reference||''}))}
function download(name,content,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){const rows=saleRows();const keys=Object.keys(rows[0]||{Datum:''});const csv=[keys.join(';'),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(';'))].join('\n');download('NOVA_Buchungen.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('CSV erstellt.')}
function exportExcel(){const rows=saleRows();const keys=Object.keys(rows[0]||{Datum:''});const html=`<html><head><meta charset="utf-8"></head><body><table border="1"><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</table></body></html>`;download('NOVA_Buchungen.xls',html,'application/vnd.ms-excel');toast('Excel-Datei erstellt.')}
function exportPDF(){const w=window.open('','_blank');const rows=saleRows();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>NOVA Monatsbericht</title><style>body{font-family:Arial;padding:28px;color:#111}h1{margin:0 0 8px}small{color:#666}table{width:100%;border-collapse:collapse;margin-top:22px;font-size:12px}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}th{background:#f5f5f5}.total{font-size:20px;font-weight:700;margin-top:22px}@media print{button{display:none}}</style></head><body><h1>${esc(state.business.name)} – Monatsbericht</h1><small>Demo-Export · ${new Date().toLocaleString('de-CH')}</small><table><tr><th>Datum</th><th>Kunde</th><th>Zahlungsart</th><th>Total</th></tr>${rows.map(r=>`<tr><td>${r.Datum}</td><td>${esc(r.Kunde)}</td><td>${esc(r.Zahlungsart)}</td><td>${money(r.Total)}</td></tr>`).join('')}</table><div class="total">Gesamt: ${money(state.sales.filter(s=>s.status==='paid').reduce((n,s)=>n+s.total,0))}</div><button onclick="window.print()">Drucken / als PDF sichern</button></body></html>`);w.document.close()}
function settingsPage(){return `<h3>Einstellungen</h3><p>Geschäftsdaten und Demo-System.</p><div class="formGrid"><div class="fieldWrap"><label>Geschäftsname</label><input id="setName" class="field" value="${esc(state.business.name)}"></div><div class="fieldWrap"><label>Branche</label><select id="setType" class="field"><option>Beauty & Services</option><option>Nail Studio</option><option>Coiffeur / Barber</option><option>Tattoo / Piercing</option><option>Massage / Wellness</option><option>Make-up / Styling</option></select></div><div class="fieldWrap"><label>E-Mail</label><input id="setEmail" class="field" value="${esc(state.business.email)}"></div></div><button class="accentBtn" style="width:100%;margin-top:12px" onclick="saveSettings()">Speichern</button><button class="ghostBtn dangerBtn" style="width:100%;margin-top:10px" onclick="resetDemo()">Demo zurücksetzen</button>`}
function saveSettings(){state.business.name=document.getElementById('setName').value;state.business.type=document.getElementById('setType').value;state.business.email=document.getElementById('setEmail').value;save();closeModal();renderAll();toast('Einstellungen gespeichert.')}
function helpPage(){return `<h3>Hilfe & Support</h3><p>Supportzugriff soll nie dauerhaft offen sein.</p><div class="card"><div class="listItem"><div class="meta"><b>Temporären Supportzugriff erlauben</b><small>Final: z. B. 30 Minuten, protokolliert und jederzeit widerrufbar.</small></div><button class="toggle" onclick="this.classList.toggle('on');toast(this.classList.contains('on')?'Supportzugriff Demo aktiviert':'Supportzugriff beendet')"></button></div></div><button class="ghostBtn" style="width:100%;margin-top:12px" onclick="toast('Support-Chat ist im Test nur ein Platzhalter.')">Support kontaktieren</button>`}
function legalPage(){return `<h3>Rechtliches & Datenschutz</h3><p>Architektur-Ziel: minimale Betreiber-Einsicht, starke Mandantentrennung, Verschlüsselung sensibler Kundendaten und explizite Supportfreigabe.</p><div class="card"><div class="listItem"><div class="meta"><b>Keine Kartendaten speichern</b><small>Zahlungen laufen über zertifizierte Payment-Provider.</small></div></div><div class="listItem"><div class="meta"><b>Mandantentrennung</b><small>Jeder Betrieb sieht nur eigene Daten.</small></div></div><div class="listItem"><div class="meta"><b>Client-seitige Verschlüsselung</b><small>Für sensible Daten in der späteren Cloud-Architektur vorgesehen.</small></div></div><div class="listItem"><div class="meta"><b>Audit-Log</b><small>Änderungen und Supportzugriffe werden protokolliert.</small></div></div></div>`}
function runAssistant(){const el=document.getElementById('aiInput');if(!el)return;const q=el.value.trim();if(!q)return;const l=q.toLowerCase();if(l.includes('umsatz')){toast('Umsatz heute: '+money(revenueToday()));return}if(l.includes('frei')){go('calendar');toast('Freie Zeit: ca. '+freeTimeToday().toFixed(1)+' h heute.');return}if(l.includes('termin')){openAppointmentModal(todayISO());return}if(l.includes('preis')||l.includes('franch')||l.includes('french')){openSubpage('services');toast('Preisänderungen werden mit Verlauf gespeichert.');return}toast('Demo-Assistent verstanden: „'+q+'“. Für echte KI folgt später ein sicherer Server-Connector.')}
function voiceDemo(){toast('Sprachsteuerung: im Prototyp noch ohne Mikrofonzugriff.')}

applyTheme();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
