function isBetween(iso,from,to){return iso>=from&&iso<=to}function globalHoliday(iso){return state.holidays.find(h=>isBetween(iso,h.from,h.to))}function employeeHoliday(empId,iso){const e=byId(state.employees,empId);return e?.vacations?.find(v=>isBetween(iso,v.from,v.to))}
function todaysAppts(){return visibleAppointments().filter(a=>a.date===TODAY).sort((a,b)=>a.time.localeCompare(b.time))}function salesToday(){return state.sales.filter(s=>s.date===TODAY&&s.status==='paid')}function revenueToday(){return salesToday().reduce((n,s)=>n+s.total,0)}
function dayHours(iso,empId=null){if(globalHoliday(iso))return null;const d=new Date(iso+'T12:00:00'),keys=['sun','mon','tue','wed','thu','fri','sat'],h=state.hours[keys[d.getDay()]];if(!h)return null;if(empId&&employeeHoliday(empId,iso))return null;if(empId){const e=byId(state.employees,empId);if(e&&!e.workDays.includes(d.getDay()))return null}return h}
function freeTimeToday(){const empIds=state.role==='employee'?[currentEmployee().id]:(teamOn()?activeEmployees().map(e=>e.id):[activeEmployees()[0]?.id]);let total=0;for(const id of empIds){const h=dayHours(TODAY,id);if(!h)continue;const mins=t=>{const [a,b]=t.split(':').map(Number);return a*60+b};const open=mins(h[1])-mins(h[0]);const booked=state.appointments.filter(a=>a.date===TODAY&&a.employeeId===id&&!['cancelled','noshow'].includes(a.status)).reduce((n,a)=>n+(a.duration||service(a).duration||0),0);total+=Math.max(0,open-booked)}return total/60}
function renderToday(){const aps=todaysAppts(),owner=state.role==='owner';document.getElementById('screen-today').innerHTML=`<div class="h1">${owner?'Guten Morgen':'Hallo '+esc(currentEmployee().name.split(' ')[0])}</div><div class="sub">${fmtDate(TODAY,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div>${owner?`<div class="aiBox"><input id="aiInput" placeholder="Was möchtest du heute tun?" onkeydown="if(event.key==='Enter')runAssistant()"><button class="iconBtn" onclick="voiceAssistant()">🎙</button><button class="iconBtn accent" onclick="runAssistant()">➜</button></div>`:''}<div class="grid3"><div class="stat"><span>Termine heute</span><b>${aps.length}</b></div><div class="stat"><span>${owner?'Umsatz heute':'Offene Termine'}</span><b>${owner?money(revenueToday()):aps.filter(a=>a.status==='open').length}</b></div><div class="stat clickable" onclick="openFreeTime()"><span>Freie Zeit</span><b>${freeTimeToday().toFixed(1).replace('.',',')} h</b></div></div><div class="sectionHead"><b>${owner?'Heute':'Meine Termine'}</b><button onclick="go('calendar')">Monat öffnen</button></div><div class="card">${aps.length?aps.map(apptHTML).join(''):'<div class="cardSub">Keine Termine.</div>'}</div>${owner?`<div class="sectionHead"><b>Schnell</b></div><div class="chips"><button class="chip" onclick="openAppointmentModal(TODAY)">+ Termin</button><button class="chip" onclick="go('pos')">Kassieren</button><button class="chip" onclick="openAssistant()">Assistent</button><button class="chip" onclick="openSubpage('stats')">Analyse</button></div>`:''}`}

function calendarApsFor(iso){let aps=visibleAppointments().filter(a=>a.date===iso);if(state.role==='owner'&&teamOn()&&state.calendarEmployee!=='all')aps=aps.filter(a=>a.employeeId===state.calendarEmployee);return aps}
function renderCalendar(){const [y,m]=state.calendarMonth.split('-').map(Number),first=new Date(y,m-1,1),start=(first.getDay()+6)%7;let cells='';for(let i=0;i<42;i++){const d=new Date(y,m-1,1-start+i),iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,aps=calendarApsFor(iso),other=d.getMonth()!==m-1,holiday=globalHoliday(iso)||(state.calendarEmployee!=='all'?employeeHoliday(state.calendarEmployee,iso):null);cells+=`<button class="dayCell ${other?'other':''} ${iso===state.selectedDate?'selected':''} ${iso===TODAY?'today':''}" onclick="selectDay('${iso}')"><span class="dayNum">${d.getDate()}</span><div class="dayDots">${aps.slice(0,6).map(a=>`<i class="miniDot ${statusClass(a.status)}"></i>`).join('')}</div>${aps.length?`<span class="dayCount">${aps.length}</span>`:''}${holiday?`<span class="holidayMark">Ferien</span>`:''}</button>`}const selected=calendarApsFor(state.selectedDate).sort((a,b)=>a.time.localeCompare(b.time)),h=state.calendarEmployee!=='all'?dayHours(state.selectedDate,state.calendarEmployee):dayHours(state.selectedDate);document.getElementById('screen-calendar').innerHTML=`<div class="h1">Kalender</div><div class="sub">Ganzer Monat auf einen Blick. Bezahlt wird automatisch als abgeschlossen erkannt.</div><div class="monthHead"><button class="calBtn" onclick="changeMonth(-1)">‹</button><h2>${new Intl.DateTimeFormat('de-CH',{month:'long',year:'numeric'}).format(first)}</h2><button class="calBtn" onclick="changeMonth(1)">›</button></div>${state.role==='owner'&&teamOn()?`<div class="chips" style="margin-bottom:9px"><button class="chip ${state.calendarEmployee==='all'?'active':''}" onclick="setCalEmp('all')">Alle</button>${activeEmployees().map(e=>`<button class="chip ${state.calendarEmployee===e.id?'active':''}" onclick="setCalEmp('${e.id}')">${esc(e.name.split(' ')[0])}</button>`).join('')}</div>`:''}<div class="weekdays"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div><div class="monthGrid">${cells}</div><div class="sectionHead"><b>${fmtDate(state.selectedDate,{weekday:'long',day:'2-digit',month:'long'})}</b>${state.role==='owner'?`<button onclick="openAppointmentModal('${state.selectedDate}')">+ Termin</button>`:''}</div><div class="card">${h?`<div class="cardSub" style="margin-bottom:6px">${h[0]} – ${h[1]}${globalHoliday(state.selectedDate)?' · geschlossen':''}</div>`:'<div class="cardSub" style="margin-bottom:6px">Geschlossen / Ferien</div>'}${selected.length?selected.map(apptHTML).join(''):'<div class="cardSub">Keine Termine.</div>'}</div>`}
function selectDay(iso){state.selectedDate=iso;state.calendarMonth=iso.slice(0,7);save();renderCalendar()}function changeMonth(delta){let [y,m]=state.calendarMonth.split('-').map(Number);m+=delta;if(m<1){m=12;y--}if(m>12){m=1;y++}state.calendarMonth=`${y}-${String(m).padStart(2,'0')}`;state.selectedDate=state.calendarMonth+'-01';save();renderCalendar()}function setCalEmp(id){state.calendarEmployee=id;save();renderCalendar()}
function renderPOS(){const open=state.appointments.filter(a=>a.date===TODAY&&a.status==='open');document.getElementById('screen-pos').innerHTML=`<div class="h1">Kasse</div><div class="sub">Einmal kassieren. Danach weiss der Termin automatisch, dass er abgeschlossen ist.</div><div class="card"><div class="cardTitle">Offene Termine</div>${open.length?open.map(a=>`<button class="serviceBtn" onclick="startCheckout('${a.id}')"><span><b>${esc(a.time)} · ${esc(customer(a).name)}</b><small>${esc(service(a).name)}${teamOn()?' · '+esc(employee(a).name):''}</small></span><strong>${money(service(a).price)}</strong></button>`).join(''):'<div class="cardSub">Keine offenen Termine.</div>'}</div><div class="card"><div class="cardTitle">Freier Verkauf</div>${state.services.filter(s=>s.active).map(s=>`<button class="serviceBtn" onclick="addToCart('${s.id}')"><span><b>${esc(s.name)}</b><small>${s.duration} Min</small></span><strong>${money(s.price)}</strong></button>`).join('')}</div><div id="cartPanel">${cartHTML()}</div>`}
function addToCart(id){const s=byId(state.services,id);cart.push({serviceId:id,qty:1,price:s.price});checkoutAppointmentId=null;renderPOS()}function startCheckout(id){const a=byId(state.appointments,id),s=service(a);cart=[{serviceId:s.id,qty:1,price:s.price}];checkoutAppointmentId=id;renderPOS();setTimeout(()=>document.getElementById('cartPanel')?.scrollIntoView({behavior:'smooth'}),30)}function setPay(m){payMethod=m;renderPOS()}
function cartHTML(){const total=cart.reduce((n,i)=>n+i.price*i.qty,0);return `<div class="card"><div class="cardTitle">Aktueller Verkauf</div>${cart.length?cart.map(i=>{const s=byId(state.services,i.serviceId);return `<div class="listItem"><div class="meta"><b>${esc(s.name)}</b><small>${s.duration} Min</small></div><span class="price">${money(i.price)}</span></div>`}).join(''):'<div class="cardSub">Noch nichts ausgewählt.</div>'}<div class="totalBox"><span>Gesamt</span><b>${money(total)}</b></div><div class="payMethods"><button class="payBtn ${payMethod==='TWINT'?'active':''}" onclick="setPay('TWINT')">TWINT</button><button class="payBtn ${payMethod==='Karte'?'active':''}" onclick="setPay('Karte')">Karte</button><button class="payBtn ${payMethod==='Bar'?'active':''}" onclick="setPay('Bar')">Bar</button></div><button class="accentBtn full" style="margin-top:9px" ${cart.length?'':'disabled'} onclick="completePayment()">${payMethod==='Bar'?'Barzahlung verbuchen':'Zahlung verbuchen'}</button></div>`}
function completePayment(){if(!cart.length)return;const ap=checkoutAppointmentId?byId(state.appointments,checkoutAppointmentId):null,total=cart.reduce((n,i)=>n+i.price*i.qty,0),sale={id:uid('sale'),date:TODAY,time:new Date().toTimeString().slice(0,5),appointmentId:ap?.id||null,customerId:ap?.customerId||null,employeeId:ap?.employeeId||(teamOn()?state.selectedEmployeeId:activeEmployees()[0]?.id),items:structuredClone(cart),subtotal:total,discount:0,tip:0,total,method:payMethod,status:'paid',reference:'DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase()};state.sales.push(sale);if(ap)ap.status='done';cart=[];checkoutAppointmentId=null;save();renderAll();toast('Zahlung verbucht · Termin automatisch bezahlt.');go('today')}
function renderCustomers(){document.getElementById('screen-customers').innerHTML=`<div class="h1">Kunden</div><div class="sub">Nur das Wesentliche: Kontakt, Notiz, Besuche und Umsatz.</div><input class="search" placeholder="Kunde suchen" oninput="filterCustomers(this.value)"><div class="card" id="customerList">${customerRows(state.customers)}</div><button class="accentBtn full" style="margin-top:11px" onclick="newCustomer()">+ Kunde</button>`}function customerRows(list){return list.map(c=>`<div class="customerRow" onclick="openCustomer('${c.id}')"><div class="customerAvatar">${esc(c.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div class="info"><b>${esc(c.name)}</b><span>${esc(c.phone||c.email||'')}</span></div><span class="chev">›</span></div>`).join('')||'<div class="cardSub">Keine Kunden.</div>'}function filterCustomers(q){const l=q.toLowerCase();document.getElementById('customerList').innerHTML=customerRows(state.customers.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(l)))}
function openCustomer(id){const c=byId(state.customers,id),aps=state.appointments.filter(a=>a.customerId===id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),sales=state.sales.filter(s=>s.customerId===id&&s.status==='paid'),sum=sales.reduce((n,s)=>n+s.total,0);modal(`<h3>${esc(c.name)}</h3><p>${esc(c.phone)} · ${esc(c.email)}</p><div class="grid3"><div class="stat"><span>Besuche</span><b>${aps.filter(a=>a.status==='done').length}</b></div><div class="stat"><span>Umsatz</span><b>${money(sum)}</b></div><div class="stat"><span>Termine</span><b>${aps.length}</b></div></div><div class="card"><div class="cardTitle">Notiz</div><div class="cardSub">${esc(c.notes||'Keine Notiz')}</div></div><div class="card"><div class="cardTitle">Verlauf</div>${aps.slice(0,8).map(apptHTML).join('')||'<div class="cardSub">Noch keine Termine.</div>'}</div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Schliessen</button><button class="accentBtn" onclick="openAppointmentModal('${TODAY}','${id}')">Termin</button></div>`)}
function newCustomer(){modal(`<h3>Neuer Kunde</h3><p>Nur Name ist Pflicht.</p><div class="formGrid"><div class="fieldWrap"><label>Name</label><input id="ncName" class="field"></div><div class="fieldWrap"><label>Telefon</label><input id="ncPhone" class="field"></div><div class="fieldWrap"><label>E-Mail</label><input id="ncEmail" class="field"></div><div class="fieldWrap"><label>Notiz</label><textarea id="ncNotes" class="field"></textarea></div></div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Abbrechen</button><button class="accentBtn" onclick="saveCustomer()">Speichern</button></div>`)}function saveCustomer(){const name=document.getElementById('ncName').value.trim();if(!name)return toast('Name eingeben.');state.customers.push({id:uid('c'),name,phone:document.getElementById('ncPhone').value,email:document.getElementById('ncEmail').value,notes:document.getElementById('ncNotes').value});save();closeModal();renderCustomers();toast('Kunde gespeichert.')}
function renderMore(){const team=teamOn();document.getElementById('screen-more').innerHTML=`<div class="h1">Mehr</div><div class="sub">Verwaltung bleibt hier – der Alltag bleibt einfach.</div><div class="card"><button class="menuItem" onclick="openSubpage('services')"><span class="menuIcon">✦</span><span class="menuText"><b>Dienstleistungen & Preise</b><span>Leistungen, Dauer, Preisverlauf</span></span><span class="chev">›</span></button>${team?`<button class="menuItem" onclick="openSubpage('team')"><span class="menuIcon">◎</span><span class="menuText"><b>Team</b><span>Arbeitszeiten, Ferien, Rechte</span></span><span class="chev">›</span></button>`:''}<button class="menuItem" onclick="openSubpage('stats')"><span class="menuIcon">↗</span><span class="menuText"><b>Analyse</b><span>Umsatz, Auslastung, Leistungen${team?', Mitarbeiter':''}</span></span><span class="chev">›</span></button><button class="menuItem" onclick="openSubpage('hours')"><span class="menuIcon">◷</span><span class="menuText"><b>Öffnungszeiten & Ferien</b><span>Kalender passt sich automatisch an</span></span><span class="chev">›</span></button><button class="menuItem" onclick="openSubpage('exports')"><span class="menuIcon">⇩</span><span class="menuText"><b>Exporte</b><span>Excel, CSV, PDF</span></span><span class="chev">›</span></button><button class="menuItem" onclick="openSubpage('branding')"><span class="menuIcon">◇</span><span class="menuText"><b>Design</b><span>Farben, Logo, Stil</span></span><span class="chev">›</span></button><button class="menuItem" onclick="openSubpage('settings')"><span class="menuIcon">⚙</span><span class="menuText"><b>Einstellungen</b><span>Geschäft, Einzelbetrieb oder Team</span></span><span class="chev">›</span></button></div>`}
function modal(html){document.getElementById('modal').innerHTML=`<button class="closeX" onclick="closeModal()">×</button>${html}`;document.getElementById('modalOverlay').classList.add('show')}function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.remove('show'),2200)}
function openAppointmentModal(date=TODAY,customerId=''){modal(`<h3>Neuer Termin</h3><p>Der Kalender prüft Öffnungszeiten und Ferien.</p><div class="formGrid"><div class="fieldWrap"><label>Datum</label><input id="apDate" class="field" type="date" value="${date}"></div><div class="fieldWrap"><label>Zeit</label><input id="apTime" class="field" type="time" value="10:00"></div><div class="fieldWrap"><label>Kunde</label><select id="apCustomer" class="field">${state.customers.map(c=>`<option value="${c.id}" ${c.id===customerId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="fieldWrap"><label>Leistung</label><select id="apService" class="field">${state.services.filter(s=>s.active).map(s=>`<option value="${s.id}">${esc(s.name)} · ${money(s.price)}</option>`).join('')}</select></div>${teamOn()?`<div class="fieldWrap"><label>Mitarbeiter</label><select id="apEmployee" class="field">${activeEmployees().map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>`:''}</div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Abbrechen</button><button class="accentBtn" onclick="saveAppointment()">Speichern</button></div>`)}
function saveAppointment(){const date=document.getElementById('apDate').value,time=document.getElementById('apTime').value,cid=document.getElementById('apCustomer').value,sid=document.getElementById('apService').value,eid=teamOn()?document.getElementById('apEmployee').value:activeEmployees()[0]?.id,s=byId(state.services,sid),h=dayHours(date,eid);if(!h)return toast('An diesem Tag ist geschlossen oder Ferien.');if(time<h[0]||time>=h[1])return toast('Zeit liegt ausserhalb der Öffnungszeit.');state.appointments.push({id:uid('a'),date,time,duration:s.duration,customerId:cid,serviceId:sid,employeeId:eid,status:'open',note:''});state.selectedDate=date;state.calendarMonth=date.slice(0,7);save();closeModal();renderAll();toast('Termin gespeichert.')}
function openAppointmentDetail(id){const a=byId(state.appointments,id);if(!a)return;const sale=state.sales.find(s=>s.appointmentId===id&&s.status==='paid');modal(`<h3>${esc(customer(a).name)}</h3><p>${fmtDate(a.date,{weekday:'long',day:'2-digit',month:'long'})} · ${esc(a.time)}</p><div class="card"><div class="listItem"><div class="meta"><b>${esc(service(a).name)}</b><small>${a.duration} Min${teamOn()?' · '+esc(employee(a).name):''}</small></div><span class="price">${money(service(a).price)}</span></div><div class="listItem"><div class="meta"><b>Status</b><small>${sale?'Zahlung '+sale.method+' · '+sale.reference:'Noch nicht bezahlt'}</small></div><span class="badge">${statusLabel(a.status)}</span></div></div>${state.role==='owner'&&a.status==='open'?`<div class="modalActions"><button class="ghostBtn dangerBtn" onclick="cancelAppointment('${id}')">Absagen</button><button class="accentBtn" onclick="closeModal();go('pos');startCheckout('${id}')">Kassieren</button></div>`:'<button class="ghostBtn full" style="margin-top:12px" onclick="closeModal()">Schliessen</button>'}`)}function cancelAppointment(id){const a=byId(state.appointments,id);a.status='cancelled';save();closeModal();renderAll();toast('Termin abgesagt.')}

function servicesPage(){return `<h3>Dienstleistungen & Preise</h3><p>Preisänderungen werden historisch gespeichert. Alte Verkäufe bleiben unverändert.</p><div class="card">${state.services.map(s=>`<div class="listItem"><div class="meta"><b>${esc(s.name)}</b><small>${esc(s.cat)} · ${s.duration} Min · ${s.active?'Aktiv':'Inaktiv'}</small></div><button class="ghostBtn" style="height:35px" onclick="editService('${s.id}')">${money(s.price)}</button></div>`).join('')}</div><button class="accentBtn full" style="margin-top:11px" onclick="addService()">+ Leistung</button>`}function editService(id){const s=byId(state.services,id);modal(`<h3>${esc(s.name)}</h3><div class="formGrid"><div class="fieldWrap"><label>Name</label><input id="esName" class="field" value="${esc(s.name)}"></div><div class="fieldWrap"><label>Preis CHF</label><input id="esPrice" class="field" type="number" step="0.05" value="${s.price}"></div><div class="fieldWrap"><label>Dauer Min.</label><input id="esDur" class="field" type="number" value="${s.duration}"></div></div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Abbrechen</button><button class="accentBtn" onclick="saveService('${id}')">Speichern</button></div>`)}function saveService(id){const s=byId(state.services,id),old=s.price,np=Number(document.getElementById('esPrice').value);s.name=document.getElementById('esName').value;s.price=np;s.duration=Number(document.getElementById('esDur').value);if(old!==np)state.priceHistory.push({id:uid('ph'),serviceId:id,oldPrice:old,newPrice:np,validFrom:new Date().toISOString()});save();closeModal();openSubpage('services');toast('Leistung gespeichert.')}function addService(){modal(`<h3>Neue Leistung</h3><div class="formGrid"><div class="fieldWrap"><label>Name</label><input id="nsName" class="field"></div><div class="fieldWrap"><label>Kategorie</label><input id="nsCat" class="field" value="Allgemein"></div><div class="formGrid two"><div class="fieldWrap"><label>Dauer</label><input id="nsDur" class="field" type="number" value="60"></div><div class="fieldWrap"><label>Preis</label><input id="nsPrice" class="field" type="number" value="0"></div></div></div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Abbrechen</button><button class="accentBtn" onclick="saveNewService()">Hinzufügen</button></div>`)}function saveNewService(){state.services.push({id:uid('s'),name:document.getElementById('nsName').value||'Neue Leistung',cat:document.getElementById('nsCat').value||'Allgemein',duration:Number(document.getElementById('nsDur').value),price:Number(document.getElementById('nsPrice').value),active:true});save();closeModal();openSubpage('services')}
function teamPage(){return `<h3>Team</h3><p>Keine Lohnabrechnung. Nur Terminplanung, Ferien und Zugriffsrechte.</p><div class="card">${activeEmployees().map(e=>`<div class="customerRow" onclick="editEmployee('${e.id}')"><div class="customerAvatar" style="color:${e.color}">${esc(e.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div class="info"><b>${esc(e.name)}</b><span>${e.workDays.length} Arbeitstage · ${e.vacations?.length||0} Ferienblöcke</span></div><span class="chev">›</span></div>`).join('')}</div><button class="accentBtn full" style="margin-top:11px" onclick="addEmployee()">+ Mitarbeiter</button>`}
function editEmployee(id){const e=byId(state.employees,id);modal(`<h3>${esc(e.name)}</h3><p>Mitarbeiter sieht standardmässig nur eigene zugeteilte Termine.</p><div class="card"><div class="cardTitle">Ferien</div>${(e.vacations||[]).map(v=>`<div class="listItem"><div class="meta"><b>${esc(v.label)}</b><small>${fmtDate(v.from)} – ${fmtDate(v.to)}</small></div><button class="ghostBtn dangerBtn" style="height:32px" onclick="removeEmpVacation('${id}','${v.id}')">×</button></div>`).join('')||'<div class="cardSub">Keine Ferien eingetragen.</div>'}<button class="ghostBtn full" style="margin-top:10px" onclick="addEmpVacation('${id}')">+ Ferien</button></div><div class="card"><div class="cardTitle">Rechte</div>${permRow(id,'ownAppointments','Eigene Termine sehen')}${permRow(id,'editOwn','Eigene Termine bearbeiten')}${permRow(id,'pos','Kasse verwenden')}${permRow(id,'customers','Kunden sehen')}</div><button class="ghostBtn full" style="margin-top:11px" onclick="closeModal()">Schliessen</button>`)}function permRow(id,k,label){const e=byId(state.employees,id);return `<div class="permissionRow"><span>${label}</span><button class="toggle ${e.permissions[k]?'on':''}" onclick="togglePerm('${id}','${k}',this)"></button></div>`}function togglePerm(id,k,b){const e=byId(state.employees,id);e.permissions[k]=!e.permissions[k];b.classList.toggle('on',e.permissions[k]);save()}function addEmpVacation(id){modal(`<h3>Ferien eintragen</h3><div class="formGrid"><div class="fieldWrap"><label>Von</label><input id="evFrom" class="field" type="date"></div><div class="fieldWrap"><label>Bis</label><input id="evTo" class="field" type="date"></div><div class="fieldWrap"><label>Bezeichnung</label><input id="evLabel" class="field" value="Ferien"></div></div><div class="modalActions"><button class="ghostBtn" onclick="editEmployee('${id}')">Abbrechen</button><button class="accentBtn" onclick="saveEmpVacation('${id}')">Speichern</button></div>`)}function saveEmpVacation(id){const f=document.getElementById('evFrom').value,t=document.getElementById('evTo').value;if(!f||!t)return toast('Von und Bis wählen.');byId(state.employees,id).vacations.push({id:uid('v'),from:f,to:t,label:document.getElementById('evLabel').value||'Ferien'});save();editEmployee(id);toast('Ferien gespeichert.')}function removeEmpVacation(id,vid){const e=byId(state.employees,id);e.vacations=e.vacations.filter(v=>v.id!==vid);save();editEmployee(id)}
function addEmployee(){modal(`<h3>Mitarbeiter hinzufügen</h3><p>Danach wird der Teammodus automatisch sichtbar.</p><div class="fieldWrap"><label>Name</label><input id="neName" class="field" placeholder="Vorname Nachname"></div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Abbrechen</button><button class="accentBtn" onclick="saveEmployee()">Hinzufügen</button></div>`)}function saveEmployee(){const n=document.getElementById('neName').value.trim()||'Neue Mitarbeiterin';state.employees.push({id:uid('e'),name:n,color:'#75b9ff',active:true,workDays:[1,2,3,4,5],vacations:[],permissions:{ownAppointments:true,editOwn:false,pos:false,customers:false}});state.business.teamMode=true;save();closeModal();renderAll();openSubpage('team')}
function statsPage(){const sales=state.sales.filter(s=>s.status==='paid'),total=sales.reduce((n,s)=>n+s.total,0),avg=sales.length?total/sales.length:0,methods={};sales.forEach(s=>methods[s.method]=(methods[s.method]||0)+s.total);const serviceMap={};sales.forEach(s=>s.items.forEach(i=>serviceMap[i.serviceId]=(serviceMap[i.serviceId]||0)+i.price*i.qty));const trend=[4100,5200,4800,6100,6900,7800,Math.max(8200,total*12)],mx=Math.max(...trend);let empHtml='';if(teamOn()){const rows=activeEmployees().map(e=>{const es=sales.filter(s=>s.employeeId===e.id),rev=es.reduce((n,s)=>n+s.total,0),aps=state.appointments.filter(a=>a.employeeId===e.id&&!['cancelled'].includes(a.status));return {e,rev,aps:aps.length}}),max=Math.max(1,...rows.map(r=>r.rev));empHtml=`<div class="card"><div class="cardTitle">Umsatz pro Mitarbeiter</div>${rows.map(r=>`<div class="metricRow"><div><b style="font-size:12px">${esc(r.e.name)}</b><div class="metricBar"><i style="width:${r.rev/max*100}%"></i></div><small style="color:var(--muted);font-size:9px">${r.aps} Termine</small></div><span class="price">${money(r.rev)}</span></div>`).join('')}</div>`}return `<h3>Analyse</h3><p>Einfach lesen, direkt verstehen. Mitarbeiterwerte erscheinen nur im Teammodus.</p><div class="grid3"><div class="stat"><span>Umsatz</span><b>${money(total)}</b></div><div class="stat"><span>Verkäufe</span><b>${sales.length}</b></div><div class="stat"><span>Ø Bon</span><b>${money(avg)}</b></div></div><div class="card"><div class="cardTitle">Umsatztrend</div><div class="chart">${trend.map(v=>`<div class="bar" style="height:${Math.max(15,v/mx*100)}%"></div>`).join('')}</div><div class="legend"><span>Mär</span><span>Apr</span><span>Mai</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span></div></div>${empHtml}<div class="card"><div class="cardTitle">Top Leistungen</div>${Object.entries(serviceMap).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`<div class="listItem"><div class="meta"><b>${esc(byId(state.services,id)?.name||'Leistung')}</b></div><span class="price">${money(v)}</span></div>`).join('')||'<div class="cardSub">Noch keine Verkäufe.</div>'}</div><div class="card"><div class="cardTitle">Zahlungsarten</div>${Object.entries(methods).map(([k,v])=>`<div class="listItem"><div class="meta"><b>${esc(k)}</b></div><span class="price">${money(v)}</span></div>`).join('')}</div><button class="ghostBtn full" style="margin-top:11px" onclick="openAssistant('Warum war dieser Monat besser oder schlechter?')">Analyse mit Assistent</button>`}
function hoursPage(){const labels={mon:'Montag',tue:'Dienstag',wed:'Mittwoch',thu:'Donnerstag',fri:'Freitag',sat:'Samstag',sun:'Sonntag'};return `<h3>Öffnungszeiten & Ferien</h3><p>Diese Angaben steuern automatisch mögliche Termine.</p><div class="card">${Object.entries(labels).map(([k,l])=>`<div class="listItem"><div class="meta"><b>${l}</b><small>${state.hours[k]?state.hours[k][0]+' – '+state.hours[k][1]:'Geschlossen'}</small></div><button class="ghostBtn" style="height:34px" onclick="editHours('${k}','${l}')">Ändern</button></div>`).join('')}</div><div class="card"><div class="cardTitle">Betriebsferien / Sondertage</div>${state.holidays.map(h=>`<div class="listItem"><div class="meta"><b>${esc(h.label)}</b><small>${fmtDate(h.from)} – ${fmtDate(h.to)}</small></div><button class="ghostBtn dangerBtn" style="height:32px" onclick="removeHoliday('${h.id}')">×</button></div>`).join('')||'<div class="cardSub">Keine Einträge.</div>'}<button class="ghostBtn full" style="margin-top:10px" onclick="addHoliday()">+ Eintragen</button></div>`}function editHours(k,l){const h=state.hours[k]||['09:00','17:00'];modal(`<h3>${l}</h3><div class="formGrid two"><div class="fieldWrap"><label>Von</label><input id="hFrom" class="field" type="time" value="${h[0]}"></div><div class="fieldWrap"><label>Bis</label><input id="hTo" class="field" type="time" value="${h[1]}"></div></div><div class="modalActions"><button class="ghostBtn dangerBtn" onclick="state.hours['${k}']=null;save();hoursBack()">Geschlossen</button><button class="accentBtn" onclick="saveHours('${k}')">Speichern</button></div>`)}function saveHours(k){state.hours[k]=[document.getElementById('hFrom').value,document.getElementById('hTo').value];save();hoursBack()}function hoursBack(){closeModal();openSubpage('hours');renderCalendar()}function addHoliday(){modal(`<h3>Ferien / Sondertag</h3><div class="formGrid"><div class="fieldWrap"><label>Bezeichnung</label><input id="hLabel" class="field" value="Ferien"></div><div class="fieldWrap"><label>Von</label><input id="hFromD" class="field" type="date"></div><div class="fieldWrap"><label>Bis</label><input id="hToD" class="field" type="date"></div></div><div class="modalActions"><button class="ghostBtn" onclick="openSubpage('hours')">Abbrechen</button><button class="accentBtn" onclick="saveHoliday()">Speichern</button></div>`)}function saveHoliday(){const f=document.getElementById('hFromD').value,t=document.getElementById('hToD').value;if(!f||!t)return toast('Von und Bis wählen.');state.holidays.push({id:uid('h'),from:f,to:t,label:document.getElementById('hLabel').value||'Ferien'});save();openSubpage('hours');renderCalendar()}function removeHoliday(id){state.holidays=state.holidays.filter(h=>h.id!==id);save();openSubpage('hours');renderCalendar()}
function saleRows(){return state.sales.map(s=>({Datum:s.date,Uhrzeit:s.time,Kunde:byId(state.customers,s.customerId)?.name||'',Mitarbeiter:teamOn()?(byId(state.employees,s.employeeId)?.name||''):'',Zahlungsart:s.method,Netto:s.subtotal,Trinkgeld:s.tip||0,Rabatt:s.discount||0,Total:s.total,Status:s.status,Referenz:s.reference||''}))}function exportsPage(){return `<h3>Exporte</h3><p>Für Treuhänder oder eigene Ablage. Keine Lohnabrechnung.</p><div class="card"><div class="listItem"><div class="meta"><b>Excel</b><small>Alle Buchungen strukturiert</small></div><button class="ghostBtn" style="height:34px" onclick="exportExcel()">Export</button></div><div class="listItem"><div class="meta"><b>CSV</b><small>Für Buchhaltungsimporte</small></div><button class="ghostBtn" style="height:34px" onclick="exportCSV()">Export</button></div><div class="listItem"><div class="meta"><b>PDF</b><small>Lesbarer Monatsbericht</small></div><button class="ghostBtn" style="height:34px" onclick="exportPDF()">Öffnen</button></div></div><div class="card"><div class="cardTitle">Buchungen</div><div class="tableWrap"><table class="table"><thead><tr><th>Datum</th><th>Kunde</th>${teamOn()?'<th>Mitarbeiter</th>':''}<th>Zahlung</th><th>Total</th></tr></thead><tbody>${saleRows().map(r=>`<tr><td>${r.Datum}</td><td>${esc(r.Kunde)}</td>${teamOn()?`<td>${esc(r.Mitarbeiter)}</td>`:''}<td>${esc(r.Zahlungsart)}</td><td>${money(r.Total)}</td></tr>`).join('')}</tbody></table></div></div>`}function download(name,content,type){const b=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportCSV(){const rows=saleRows(),keys=Object.keys(rows[0]||{Datum:''}),csv=[keys.join(';'),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(';'))].join('\n');download('NOVA_Buchungen.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('CSV erstellt.')}function exportExcel(){const rows=saleRows(),keys=Object.keys(rows[0]||{Datum:''}),html=`<html><meta charset="utf-8"><table border="1"><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</table></html>`;download('NOVA_Buchungen.xls',html,'application/vnd.ms-excel');toast('Excel erstellt.')}function exportPDF(){const w=window.open('','_blank'),rows=saleRows();if(!w)return toast('Popup erlauben.');w.document.write(`<!doctype html><html><meta charset="utf-8"><title>Monatsbericht</title><style>body{font-family:Arial;padding:28px}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:12px}</style><h1>${esc(state.business.name)}</h1><p>Monatsbericht · ${new Date().toLocaleDateString('de-CH')}</p><table><tr><th>Datum</th><th>Kunde</th><th>Zahlung</th><th>Total</th></tr>${rows.map(r=>`<tr><td>${r.Datum}</td><td>${esc(r.Kunde)}</td><td>${r.Zahlungsart}</td><td>${money(r.Total)}</td></tr>`).join('')}</table><h2>Gesamt: ${money(state.sales.filter(s=>s.status==='paid').reduce((n,s)=>n+s.total,0))}</h2><button onclick="window.print()">Drucken / PDF sichern</button>`);w.document.close()}
function brandingPage(){return `<h3>Design</h3><p>Alle Designoptionen inklusive.</p><div class="card"><div class="listItem"><div class="meta"><b>Akzentfarbe</b><small>Buttons, Icons, Kalender</small></div><input class="colorInput" type="color" value="${state.business.accent}" oninput="changeAccent(this.value)"></div><div class="listItem"><div class="meta"><b>Logo</b><small>In der Testversion lokal simuliert</small></div><button class="ghostBtn" style="height:34px" onclick="toast('Logo-Upload folgt mit Cloud-Speicher.')">Hochladen</button></div><div class="listItem"><div class="meta"><b>Stil</b><small>Minimal · Elegant · Modern · Outline · Neon</small></div></div></div>`}function changeAccent(v){state.business.accent=v;save();renderAll();openSubpage('branding')}
function settingsPage(){return `<h3>Einstellungen</h3><p>Ein Einzelbetrieb sieht keine unnötigen Teamfelder.</p><div class="card"><div class="permissionRow"><span>Ich arbeite mit einem Team</span><button class="toggle ${state.business.teamMode?'on':''}" onclick="toggleTeamMode(this)"></button></div></div><div class="formGrid" style="margin-top:11px"><div class="fieldWrap"><label>Geschäftsname</label><input id="stName" class="field" value="${esc(state.business.name)}"></div><div class="fieldWrap"><label>Branche</label><select id="stType" class="field"><option ${state.business.type==='Beauty & Services'?'selected':''}>Beauty & Services</option><option ${state.business.type==='Nail Studio'?'selected':''}>Nail Studio</option><option ${state.business.type==='Coiffeur / Barber'?'selected':''}>Coiffeur / Barber</option><option ${state.business.type==='Tattoo / Piercing'?'selected':''}>Tattoo / Piercing</option><option ${state.business.type==='Massage / Wellness'?'selected':''}>Massage / Wellness</option></select></div></div><button class="accentBtn full" style="margin-top:11px" onclick="saveSettings()">Speichern</button><button class="ghostBtn dangerBtn full" style="margin-top:9px" onclick="resetDemo();closeModal()">Testdaten zurücksetzen</button>`}function toggleTeamMode(b){state.business.teamMode=!state.business.teamMode;b.classList.toggle('on',state.business.teamMode);save()}function saveSettings(){state.business.name=document.getElementById('stName').value||'Mein Studio';state.business.type=document.getElementById('stType').value;save();closeModal();renderAll();toast('Einstellungen gespeichert.')}
function openAccountMenu(){if(state.role==='owner')modal(`<h3>Account</h3><p>Testmodus wechseln oder abmelden.</p><button class="ghostBtn full" onclick="state.role='employee';state.selectedEmployeeId='e1';save();closeModal();renderAll();go('today')">Mitarbeiteransicht testen</button><button class="ghostBtn full" style="margin-top:8px" onclick="logout();closeModal()">Abmelden</button>`);else modal(`<h3>${esc(currentEmployee().name)}</h3><p>Du siehst nur deine eigenen Termine.</p><button class="ghostBtn full" onclick="state.role='owner';save();closeModal();renderAll();go('today')">Zur Inhaberansicht</button><button class="ghostBtn full" style="margin-top:8px" onclick="logout();closeModal()">Abmelden</button>`)}
function openAssistant(prefill=''){if(prefill)state.aiHistory.push({role:'user',text:prefill});modal(`<h3>Assistent <span class="badge">aktiv</span></h3><p>Kann in dieser Testversion Daten lesen und mehrere typische Aktionen direkt ausführen.</p><div id="aiChat" class="aiChat">${state.aiHistory.slice(-12).map(m=>`<div class="bubble ${m.role==='user'?'user':'ai'}">${esc(m.text)}</div>`).join('')}</div><div class="aiExamples"><button class="aiExample" onclick="askAI('Wie viel Umsatz heute?')">Umsatz heute</button><button class="aiExample" onclick="askAI('Finde freie Zeit heute')">Freie Zeit</button><button class="aiExample" onclick="askAI('Zeig Umsatz pro Mitarbeiter')">Mitarbeiter</button></div><div class="aiBox"><input id="aiModalInput" value="${esc(prefill)}" placeholder="Schreib einfach..." onkeydown="if(event.key==='Enter')askAI(this.value)"><button class="iconBtn" onclick="voiceAssistant(true)">🎙</button><button class="iconBtn accent" onclick="askAI(document.getElementById('aiModalInput').value)">➜</button></div>`);if(prefill)setTimeout(()=>askAI(prefill),20)}
function runAssistant(){const q=document.getElementById('aiInput')?.value.trim();if(q)openAssistant(q)}
function askAI(q){q=String(q||'').trim();if(!q)return;state.aiHistory.push({role:'user',text:q});const l=q.toLowerCase();let answer='';if(l.includes('umsatz')&&l.includes('mitarbeiter')){if(!teamOn())answer='Du arbeitest im Einzelbetrieb. Deshalb gibt es keine Mitarbeiter-Auswertung.';else answer=activeEmployees().map(e=>`${e.name}: ${money(state.sales.filter(s=>s.status==='paid'&&s.employeeId===e.id).reduce((n,s)=>n+s.total,0))}`).join(' · ')}else if(l.includes('umsatz'))answer=`Heute wurden ${money(revenueToday())} verbucht. Insgesamt liegen in dieser Testversion ${state.sales.filter(s=>s.status==='paid').length} bezahlte Verkäufe vor.`;else if(l.includes('frei')){answer=`Heute sind ungefähr ${freeTimeToday().toFixed(1).replace('.',',')} Stunden frei. Ich öffne dir den Kalender.`;state.aiHistory.push({role:'ai',text:answer});save();closeModal();openFreeTime();return}else if(l.includes('termin')){answer='Ich öffne einen neuen Termin. Datum, Kunde, Leistung und Mitarbeiter kannst du direkt bestätigen.';state.aiHistory.push({role:'ai',text:answer});save();closeModal();openAppointmentModal(TODAY);return}else if((l.includes('preis')||l.includes('chf'))&&(l.includes('änder')||l.includes('auf')||l.includes('preis'))){const price=(q.match(/(?:chf\s*)?(\d+(?:[.,]\d{1,2})?)/i)||[])[1];const found=state.services.find(s=>l.includes(s.name.toLowerCase().split(' ')[0]))||state.services.find(s=>l.includes(s.name.toLowerCase()));if(found&&price){answer=`Ich habe ${found.name} erkannt. Neuer Preis ${money(Number(price.replace(',','.')))}. Bitte bestätige die Änderung im nächsten Fenster.`;state.aiHistory.push({role:'ai',text:answer});save();closeModal();confirmAIPrice(found.id,Number(price.replace(',','.')));return}answer='Ich konnte Leistung oder Preis nicht eindeutig erkennen. Öffne Dienstleistungen & Preise oder nenne z. B. „Auffüllen auf CHF 75“.'}else if(l.includes('analyse')||l.includes('warum')||l.includes('besser')||l.includes('schlechter'))answer=`Kurzanalyse: Der aktuell verbuchte Umsatz beträgt ${money(state.sales.filter(s=>s.status==='paid').reduce((n,s)=>n+s.total,0))}. Für echte Ursachenanalysen braucht die spätere Cloud-Version mehr historische Daten; diese Testversion zeigt dir bereits die berechneten Kennzahlen.`;else answer='Ich kann aktuell Termine öffnen, freie Zeiten finden, Umsatz und Mitarbeiterwerte auswerten sowie Preisänderungen vorbereiten. Probier z. B. „Auffüllen auf CHF 75“.';state.aiHistory.push({role:'ai',text:answer});save();openAssistant()}
function confirmAIPrice(id,np){const s=byId(state.services,id);modal(`<h3>Änderung bestätigen</h3><p>Der Assistent führt Preisänderungen nie still aus.</p><div class="card"><div class="listItem"><div class="meta"><b>${esc(s.name)}</b><small>${money(s.price)} → ${money(np)}</small></div></div></div><div class="modalActions"><button class="ghostBtn" onclick="closeModal()">Abbrechen</button><button class="accentBtn" onclick="applyAIPrice('${id}',${np})">Bestätigen</button></div>`)}function applyAIPrice(id,np){const s=byId(state.services,id),old=s.price;s.price=np;state.priceHistory.push({id:uid('ph'),serviceId:id,oldPrice:old,newPrice:np,validFrom:new Date().toISOString(),changedBy:'assistant'});save();closeModal();renderAll();toast('Preis geändert und historisiert.')}
function voiceAssistant(inModal=false){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Spracherkennung wird von diesem Browser nicht unterstützt.');const r=new SR();r.lang='de-CH';r.interimResults=false;r.onresult=e=>{const t=e.results[0][0].transcript;if(inModal){const el=document.getElementById('aiModalInput');if(el)el.value=t}else{const el=document.getElementById('aiInput');if(el)el.value=t}toast('Sprache erkannt.')};r.onerror=()=>toast('Mikrofon konnte nicht verwendet werden.');r.start()}
applyTheme();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
